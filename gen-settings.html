<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
     <script type="module" src="/src/components/site-navbar.js"></script> 
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
     <div class="container my-4">
     <label for="size" class="form-label">Difficulty</label>
    <input type="range" class="form-range"
       id="size" name="size"
       min="1" max="5" step="1" value="3">

<div class="d-flex justify-content-between">
  <span>Easy</span>
  <span>Medium</span>
  <span>Difficult</span>
  <span>Exam</span>
  <span>Final</span>
</div>

<div class="mb-3 my-4">
  <label for="courseName" class="form-label">Course Name</label>
  <input type="text" class="form-control"
         id="courseName" name="courseName"
         placeholder="Enter an course name"
         maxlength="50" required>
</div>

<div class="row g-3 mb-3">
  <div class="col-6">
    <label for="quantity" class="form-label">Questions</label>
    <input type="number" class="form-control"
           id="quantity" name="quantity" min="1" value="1">
  </div>

  <div class="col-6">
    <label for="objectType" class="form-label">Topic</label>
    <select class="form-select" id="objectType" name="objectType">
      <option value="" selected disabled>Choose a type</option>
      <option value="small">Programming</option>
      <option value="medium">System Design</option>
      <option value="large">Prototyping</option>
    </select>
  </div>
</div>

<div class="text-center my-4">
  <button type="button" class="btn btn-primary btn-lg px-5 py-3 fs-2 fw-bold">
    Generate
  </button>
</div>
</div>


    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
<script type="module" src="/src/main.js"></script>
</body>

</html>
