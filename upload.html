<!doctype html>
<html lang="en">

<head>
  <title>My BCIT Project</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Web Components for shared navbar and footer layout -->
  <script type="module" src="/src/components/site-navbar.js"></script>
  <script type="module" src="/src/components/site-footer.js"></script>
  <script type="module" src="/src/styles/style.css"></script>
  <link rel="stylesheet" href="/upload.css" />

</head>

<body>
  <!------------------------------>
  <!-- Your HTML Layout go here -->
  <!------------------------------>

  <!-- our own navbar goes here -->
  <site-navbar></site-navbar>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Hidden PDF Input -->
    <input type="file" id="pdfInput" accept=".pdf,application/pdf" hidden />

    <!-- Upload Area -->
    <section class="upload-area" id="dropArea">
      <h1>Upload PDF</h1>
      <p>Drag and drop a PDF here, or browse for a file.</p>

      <button type="button" id="browseButton">Browse Files</button>

      <div id="uploadStatus" role="status"></div>
    </section>

    <!-- Upload Complete Section -->
    <section id="uploadDone" class="upload-done" hidden>
      <h2>Upload Complete</h2>
      <p id="uploadedFileName"></p>

      <button type="button" id="goToQuizButton">
        Continue to Settings
      </button>

      <!-- <button type="button" id="backToDocumentsButton">
        Upload Another PDF
      </button> -->
    </section>
  </main>

  <!-- our own footer goes here -->
  <site-footer></site-footer>

  <!---------------------------------------------->
  <!-- Your own JavaScript scripts go here      -->
  <!---------------------------------------------->
  <script type="module" src="/src/upload.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>

</html>
